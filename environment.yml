# Python environment for pipeline/ and analysis/
name: mfx
channels: [conda-forge]
dependencies:
  - python=3.14
  - numpy=2.4
  - pandas=2.3
  - scipy=1.16
  - scikit-learn=1.8
  - statsmodels=0.14
  - pyarrow
  - pyyaml
  - tifffile
  - scikit-image
  - shapely
  - umap-learn=0.5
  - matplotlib=3.10
  - python-igraph=1.0
  - leidenalg=0.11
  - pip
  - pip:
      - anndata==0.12.12
      - scanpy==1.12
      - zarr==3.2.1
      - pydeseq2==0.5.4
      - harmonypy==0.2.0
      - -e .
# R: analysis/niches/niche_composition_dm.R needs brms 2.23, rstan 2.32, posterior 1.7, data.table
# Other software: Xenium onboard analysis 3.3.0.1, 3.3.1.1 and 4.0.1.0; Proseg 3.0.7 (pipeline/01_segmentation)
